<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使い方ガイド — 手かざし記録アプリ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
               overflow: hidden; }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            z-index: 100;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 15px;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .back-btn:active { background: rgba(255,255,255,0.35); }
        .header-title { font-size: 16px; font-weight: bold; }

        .pdf-container {
            position: fixed;
            top: 50px; left: 0; right: 0; bottom: 0;
        }
        embed, .fallback-msg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* embedが使えない環境向けのフォールバック */
        .fallback-msg {
            display: none;
            padding: 24px 16px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        .fallback-msg a {
            display: block;
            margin-top: 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="history.back()">← 戻る</button>
        <span class="header-title">使い方ガイド</span>
    </div>

    <div class="pdf-container">
        <embed id="pdf-embed"
               src="tekazashi_guide.pdf"
               type="application/pdf"
               width="100%"
               height="100%">

        <!-- embedが表示されない場合のフォールバック -->
        <div class="fallback-msg" id="fallback">
            <p>PDFの表示に対応していない環境です。<br>下のリンクからPDFをご確認ください。</p>
            <a href="tekazashi_guide.pdf">📄 使い方ガイド（PDF）を開く</a>
        </div>
    </div>

    <script>
        // embedが読み込めなかった場合にフォールバックを表示
        var embed = document.getElementById('pdf-embed');
        embed.onerror = function () {
            embed.style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
        };
    </script>

</body>
</html>
